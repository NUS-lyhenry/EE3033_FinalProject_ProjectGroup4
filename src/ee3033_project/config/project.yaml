project_mission:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    target_class: cup  # Overridden by the target_class launch argument.
    allow_motion: false
    clearance: 0.14
    viewpoint_spacing: 0.65
    camera_range: 2.0
    camera_fov: 1.35  # Conservative horizontal field of view, radians.
    viewpoint_headings: 6
    max_candidates: 250
    candidate_limit: 1000  # Fail explicitly above this bound; never silently drop views.
    max_goals: 120
    coverage_fraction: 0.98
    observe_seconds: 3.0
    min_observation_frames: 3
    max_observation_retries: 2
    search_linear_speed: 0.12  # Estimated travel cost, not a movement command.
    search_angular_speed: 0.40
    goal_timeout: 75.0
    mission_timeout: 900.0
    return_tolerance: 0.20  # Replace with examiner's specified tolerance.
    return_heading_required: false
    verify_seconds: 2.0
    max_stationary_speed: 0.035  # Mean absolute linear speed, m/s, over verify_seconds.
    max_stationary_angular_speed: 0.10  # Mean absolute yaw rate, rad/s.
    stationary_position_span: 0.05  # Maximum odometry XY window span, metres.
    stationary_heading_span: 0.12  # Maximum unwrapped yaw span, radians.
    stationary_max_gap: 0.25  # Maximum gap/age of odometry samples, seconds.
    stationary_command_timeout: 0.30  # Fresh zero final commands are required.
    max_xy_variance: 0.16
    max_yaw_variance: 0.36
    max_target_variance: 0.01  # Soft target precision goal (0.10 m sigma), not a report veto.
    sensor_timeout: 1.0
    perception_timeout: 3.0
    localize_wait_seconds: 2.0  # Allow exposure-time motion window + distinct frames.
    results_directory: ~/ee3033_results

project_perception:
  ros__parameters:
    model: /home/ros2_ws/weights/yolo26n.pt
    target_class: cup
    confidence: 0.60
    image_topic: /image_raw
    camera_info_topic: /camera_info
    scan_topic: /scan_fixed
    camera_optical_frame: project_camera_optical
    map_frame: map
    localization_method: hybrid
    max_scan_delta: 0.25
    max_image_age: 1.5
    inference_period: 0.25
    image_size: 416
    max_range: 3.0
    position_sigma: 0.10
    min_lidar_points: 2
    cluster_gap: 0.12
    max_cluster_width: 0.50
    cpu_threads: 1
    observation_window: 0.6
    observation_linear_mean: 0.05  # Balance oscillations may exceed this instantaneously.
    observation_angular_mean: 0.12
    observation_position_span: 0.04
    observation_heading_span: 0.10

project_target_filter:
  ros__parameters:
    confirmation_frames: 4
    confidence: 0.60
    max_frame_gap: 1.2
    posterior_window: 8.0
    posterior_samples: 30
    common_error_fraction: 0.8
    unknown_prior_weight: 0.25
    max_observation_age: 2.0
    map_frame: map

project_velocity_gate:
  ros__parameters:
    allow_motion: false
    command_timeout: 0.5
    heartbeat_timeout: 0.7
    scan_timeout: 0.7
    max_linear: 0.12
    max_angular: 0.40
    stop_distance: 0.22
    rotation_clearance: 0.14
